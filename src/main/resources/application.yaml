spring:
  application:
    name: bookstore
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/bookstore}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update

server:
  port: ${SERVER_PORT:8081}

jwt:
  secret: ${JWT_SECRET}
  ttl-seconds: ${JWT_TTL:3600}
